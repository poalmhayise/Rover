# Hired public deployment on Render. This requires a PAID web service
# and a persistent disk because customer orders and receipt uploads are private data.
# NEVER commit .env or customer data to a public GitHub repository.
services:
  - type: web
    name: hired-documents
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    disk:
      name: hired-persistent-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: HIRED_HOST
        value: 0.0.0.0
      - key: HIRED_DATA_DIR
        value: /opt/render/project/src/data
      - key: HIRED_HTTPS_ONLY
        value: "1"
      - key: HIRED_SECRET_KEY
        generateValue: true
      - key: HIRED_ADMIN_PASSWORD
        sync: false
      - key: HIRED_BANK_ACCOUNT_NAME
        sync: false
      - key: HIRED_BANK_ACCOUNT_NUMBER
        sync: false
      - key: HIRED_BANK_SWIFT
        sync: false
      - key: HIRED_USD_BANK_VERIFIED
        value: "0"
