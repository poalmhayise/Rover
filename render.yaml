# Hired's zero-disk deployment on Render Free.
# PostgreSQL and private file storage are managed by Neon, never local Render files.
# Configure ALL private values only in the Render dashboard, not GitHub.
services:
  - type: web
    name: hired-documents
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /
    envVars:
      - key: HIRED_HOST
        value: 0.0.0.0
      - key: HIRED_HTTPS_ONLY
        value: "1"
      - key: HIRED_SECRET_KEY
        generateValue: true
      - key: HIRED_ADMIN_PASSWORD
        sync: false
      - key: HIRED_BANK_ACCOUNT_NAME
        sync: false
      - key: HIRED_BANK_ACCOUNT_NUMBER
        sync: false
      - key: HIRED_BANK_SWIFT
        sync: false
      - key: HIRED_USD_BANK_VERIFIED
        value: "0"
      - key: HIRED_SUPPORT_EMAIL
        sync: false
      - key: HIRED_PUBLIC_URL
        sync: false
      - key: HIRED_DATABASE_URL
        sync: false
      - key: HIRED_S3_BUCKET
        sync: false
      - key: HIRED_S3_ENDPOINT
        sync: false
      - key: HIRED_S3_ACCESS_KEY_ID
        sync: false
      - key: HIRED_S3_SECRET_ACCESS_KEY
        sync: false
      - key: HIRED_S3_REGION
        sync: false
